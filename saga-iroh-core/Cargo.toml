[package]
name = "saga-iroh-core"
version = "0.1.0"
edition = "2021"
description = "JNI bridge for Saga Iroh call transport on Android"

[lib]
name = "saga_iroh_core"
crate-type = ["cdylib"]

[features]
default = []
iroh-transport = ["dep:iroh", "dep:tokio", "dep:iroh-roq"]
# Debug / E2E only: software SessionToken + local insecure relay TLS + BLAKE3 dev labels.
mock-token = ["iroh-transport", "dep:mock_token", "dep:blake3", "iroh/test-utils"]

[dependencies]
jni = "0.21"
log = "0.4"
saga-session = { path = "../saga-session" }
# RoQ media framing (datagrams). Fork ported to Saga's iroh 1.x pin — see docs/upstream/iroh-roq-port.md.
iroh-roq = { git = "https://github.com/Supermagnum/iroh-roq", rev = "c9b02963a1c786f7ae2788ee4c39e44c9c76b01d", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[dependencies.iroh]
version = "1.0"
optional = true
default-features = true
# `test-utils` (local insecure relay TLS) only via feature `mock-token`.

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "time", "sync", "io-util"]
optional = true

[dependencies.blake3]
version = "1"
optional = true

[dependencies.mock_token]
package = "mock-token"
path = "../testing/mock-token"
optional = true

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = true
codegen-units = 1

# Fast native builds for CI and local debug APKs (no fat LTO).
# Release / F-Droid keep [profile.release] above.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
