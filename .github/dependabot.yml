version: 2
updates:
  - package-ecosystem: cargo
    directory: /saga-iroh-core
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    groups:
      cargo-patch-and-minor:
        update-types:
          - patch
          - minor

  - package-ecosystem: cargo
    directory: /testing/mock-token
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    groups:
      cargo-patch-and-minor:
        update-types:
          - patch
          - minor

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - android
    groups:
      gradle-patch-and-minor:
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
