# Gating checks for push/PR. Target wall time ~10 minutes with warm caches.
# Emulator E2E (two AVDs) is local-only — see testing/e2e/README.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail native builds hard; never ship StubIrohCallSession from CI.
  SAGA_REQUIRE_NATIVE: "1"

jobs:
  rust:
    name: rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      - name: Install cmake (libopus via audiopus_sys)
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            saga-session
            saga-iroh-core
            saga-media
            testing/mock-token
            tools/saga-peer
          shared-key: saga-rust-host-v4
          cache-targets: true

      # audiopus_sys builds libopus via cmake; pin a dedicated target cache on the media lockfile.
      - name: Cache saga-media target (libopus)
        uses: actions/cache@v6
        with:
          path: saga-media/target
          key: saga-media-target-${{ runner.os }}-${{ hashFiles('saga-media/Cargo.lock') }}-test-opt2
          restore-keys: |
            saga-media-target-${{ runner.os }}-

      # saga-peer reuses saga-media/iroh; keep its target warm separately (WAV-only CI; no live-audio).
      - name: Cache saga-peer target
        uses: actions/cache@v6
        with:
          path: tools/saga-peer/target
          key: saga-peer-target-${{ runner.os }}-${{ hashFiles('tools/saga-peer/Cargo.lock') }}-test-opt2
          restore-keys: |
            saga-peer-target-${{ runner.os }}-

      - name: saga-session fmt / clippy / test
        working-directory: saga-session
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: mock-token fmt / clippy / test
        working-directory: testing/mock-token
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: saga-media fmt / clippy / test
        working-directory: saga-media
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: saga-iroh-core fmt / clippy / test
        working-directory: saga-iroh-core
        run: |
          cargo fmt --check
          cargo clippy --all-targets --features iroh-transport,mock-token -- -D warnings
          cargo clippy --all-targets --features iroh-transport -- -D warnings
          cargo test --features iroh-transport,mock-token

      # Default features only (no live-audio/cpal). [profile.test] opt-level=2 for Opus speed.
      - name: saga-peer fmt / clippy / host tests
        working-directory: tools/saga-peer
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --offline || cargo test

  android:
    name: android (assembleDebug + unit tests + native .so)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Standalone validation; keep actions/cache for Gradle (faster than setup-gradle alone).
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          # CI packages x86_64 for debug APK; also arm64 for release .so hygiene check.
          targets: x86_64-linux-android,aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: saga-iroh-core
          shared-key: saga-rust-ndk-x86_64-ci
          cache-targets: true

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Do not request obsolete `tools` package (fails sdkmanager on current images).
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Setup Android NDK (pinned r27c)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 3.5.4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: assembleDebug + unit tests (require native)
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon -Psaga.requireNative=true

      - name: Assert libsaga_iroh_core.so is packaged in the APK
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/saga-apk-list.txt
          # CI builds x86_64 only (cargo profile=ci, no LTO). Release keeps both ABIs.
          grep -q "lib/x86_64/libsaga_iroh_core.so" /tmp/saga-apk-list.txt
          if grep -q "lib/arm64-v8a/libsaga_iroh_core.so" /tmp/saga-apk-list.txt; then
            echo "UNEXPECTED: arm64-v8a .so present in CI debug APK (should be x86_64-only)"
            exit 1
          fi
          echo "OK: libsaga_iroh_core.so present for x86_64 (CI)"

      - name: Release arm64 .so mock/dev hygiene (no mock-token)
        working-directory: saga-iroh-core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          cargo ndk -o /tmp/saga-ndk-release-ci -t arm64-v8a \
            build --release --features iroh-transport
          bash ../scripts/check-release-so.sh \
            /tmp/saga-ndk-release-ci/arm64-v8a/libsaga_iroh_core.so
