# Prefer reproducible builds that keep the developer signature so GitHub and
# F-Droid installs can update each other (see docs/release.md).
# Primary GitHub asset for phones is arm64-v8a; universal includes x86_64 too.
Binaries: https://github.com/Supermagnum/saga/releases/download/v0.1.0-preview.1/saga-0.1.0-preview.1-arm64-v8a.apk
AllowedAPKSigningKeys: 7a6a218e8a497a51232ca11c9a10b362769c4969fa7dd26b359838a08cb7dd9a

Builds:
  - versionName: 0.1.0-preview.1
    versionCode: 1
    commit: v0.1.0-preview.1
    timeout: 14400
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential curl ca-certificates
        cmake python3 pkg-config libssl-dev rustup
    gradle:
      - yes
    prebuild:
      - rustup toolchain install 1.94.0 --profile minimal
      - rustup default 1.94.0
      - rustup target add aarch64-linux-android x86_64-linux-android
      - cargo install cargo-ndk --locked --version 3.5.4
      - printf 'sdk.dir=%s\nndk.dir=%s\n' "$$SDK$$" "$$NDK$$" > local.properties
      - printf 'sdk.dir=%s\nndk.dir=%s\n' "$$SDK$$" "$$NDK$$" > ../local.properties
    build:
      - export ANDROID_NDK_HOME="$$NDK$$"
      - export ANDROID_HOME="$$SDK$$"
      - export ANDROID_NDK_ROOT="$$NDK$$"
      - export SAGA_REQUIRE_NATIVE=1
      - export CMAKE_POLICY_VERSION_MINIMUM=3.5
      - export SOURCE_DATE_EPOCH="$$SOURCE_DATE_EPOCH$$"
      - ./gradlew assembleRelease --no-daemon -Psaga.requireNative=true
      - bash ../scripts/check-release-apk.sh
        app/build/outputs/apk/release/app-release-unsigned.apk
    ndk: r27c

AutoUpdateMode: None
UpdateCheckMode: Tags
UpdateCheckData: android/app/build.gradle.kts|versionCode\\s*=\\s*(\\d+)|.|versionName\\s*=\\s*\"(.*)\"
