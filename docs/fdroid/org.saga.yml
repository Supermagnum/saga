AntiFeatures:
  NonFreeNet:
    en-US: Default encrypted calls use n0 public relays and discovery (*.relay.n0.iroh.link).
      Relay software is open source, but the default operators are not run by Saga.
      Private DNS (DoT) is recommended. ISP resolvers such as Telenor Nettvern with
      Private DNS off can break relay TLS.
